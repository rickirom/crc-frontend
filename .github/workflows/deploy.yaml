name: CI/CD - Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

# Env vars are taken from the GH Actions env vars feature. Env:prod

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    outputs:
      build-succeeded: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present

      - name: Generate resume data
        run: npm run generate:resume

      - name: Build (next build -> ./out)
        id: build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-static-export
          path: ./out
          retention-days: 1

  # --- Terraform via HCP Terraform (API-driven workspace) ---
  #
  terraform-apply:
    name: HCP Terraform Plan + Apply
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    env:
      # No need to pass as inputs to each action
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: "crc-frontend"
      TF_DIRECTORY: "./infra"
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.TF_DIRECTORY }}

      - uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: create-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}

      - uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        # assign id attribute to reference in subsequent steps
        id: apply
        with:
          run: ${{ steps.create-run.outputs.run_id }}
          comment: "Confirmed from GitHub Actions CI"


  deploy:
    name: Deploy to S3 + Invalidate CloudFront
    needs: [ci, terraform-apply]   
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Important:
    environment: prod
        
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-static-export
          path: ./out

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./out s3://${{ vars.S3_BUCKET }} --delete

      - name: Look up CloudFront distribution
        id: cf
        run: |
            ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${{ vars.S3_BUCKET }}')].Id | [0]" \
            --output text)
            [ "$ID" != "None" ] || { echo "No distribution found for ${{ vars.S3_BUCKET }}"; exit 1; }
            echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf.outputs.id }} \
            --paths "/*"